seed: 42

dataset:
  raw_dir: dataset/raw
  processed_dir: dataset/processed
  hdf5_file: dataset/processed/shl2026.hdf5
  positions: [Bag, Hand, Hips, Torso]
  sensors: [Acc_x, Acc_y, Acc_z, Gyr_x, Gyr_y, Gyr_z, Mag_x, Mag_y, Mag_z]
  label_map:
    1: Still
    2: Walking
    3: Run
    4: Bike
    5: Car
    6: Bus
    7: Train
    8: Metro
  window_size: 500       # samples per window (500 Hz × 1 s)
  hop_size: 250          # 50% overlap

features:
  stat_features: true    # mean, std, min, max, range, energy, zcr
  fft_features: true     # top-k FFT magnitudes
  fft_top_k: 20

model:
  type: random_forest    # random_forest | mlp | frozen_foundation
  rf:
    n_estimators: 200
    max_depth: null
    n_jobs: -1
  mlp:
    hidden: [256, 128]
    dropout: 0.3
    epochs: 50
    batch_size: 512
    lr: 1.0e-3

output_dir: outputs
log_level: INFO
