seed: 42

dataset:
  raw_dir: dataset/raw
  processed_dir: dataset/processed
  hdf5_file: dataset/processed/shl2026.hdf5
  positions: [Bag, Hand, Hips, Torso]
  sensors: [Acc_x, Acc_y, Acc_z, Gyr_x, Gyr_y, Gyr_z, Mag_x, Mag_y, Mag_z]
  label_map:
    1: Still
    2: Walking
    3: Run
    4: Bike
    5: Car
    6: Bus
    7: Train
    8: Metro
  # Test split is stored as (92726, 500, 9) pre-windowed
  # Train/val stored as flat (N, 9) — windowed during feature extraction
  test_n_windows: 92726
  window_size: 500       # samples per window
  hop_size: 250          # 50 % overlap

features:
  # Statistical: 9 axes × 7 stats = 63, plus 3 group magnitudes × 5 = 15 → 78
  # Spectral:    9 axes × (fft_top_k+3) + 3 groups × (fft_top_k+3)
  # Total with fft_top_k=20: 78 + 9×23 + 3×23 = 354
  stat_features: true
  spectral_features: true
  fft_top_k: 20

baseline:
  positions: [Bag]           # single position for quick experiments
  fusion: none               # none | early
  model: rf                  # rf | lr
  sample_limit: 5000         # windows per split for fast mode; null = full dataset
  rf:
    n_estimators: 100
    n_jobs: -1
  lr:
    max_iter: 500

submission:
  output: outputs/submissions/FeatureFlyers_predictions.txt

model:
  type: random_forest    # random_forest | mlp | frozen_foundation
  rf:
    n_estimators: 200
    max_depth: null
    n_jobs: -1
  mlp:
    hidden: [256, 128]
    dropout: 0.3
    epochs: 50
    batch_size: 512
    lr: 1.0e-3

deep:
  model: cnn1d
  position: Bag
  epochs: 50
  batch_size: 512
  lr: 1.0e-3
  dropout: 0.3
  num_workers: 0
  seed: 42
  output_dir: outputs/deep_baseline

output_dir: outputs
log_level: INFO
