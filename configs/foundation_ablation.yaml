# Stage 5 — Foundation model ablation configuration
# Reference for the planned experiment table (A–G).
# Pass individual flags on the CLI; this file documents the canonical settings.

encoder: moment          # moment | fallback | chronos (not installed) | uni2ts (not installed)
position: Bag            # Bag | Hand | Hips | Torso
sample_limit: 20000      # null = full dataset; 20000 for ablation sweep; 5000 for smoke tests

# Preprocessing
norm: per-window         # none | per-window | channel-global | train-stats
include_magnitude: false # append Acc/Gyr/Mag Euclidean magnitude channels (+3 channels)
include_delta: false     # append first-difference channels (+C channels)

# Embedding
embed_strategy: mean_pool  # mean_pool | last_patch | sensorwise | flatten_patches

# Head
head: mlp                # linear | mlp | residual_mlp | xgb | logistic
hybrid_stat_features: false  # if true, concatenate 354-dim stat features

# PyTorch head hyper-parameters (ignored for xgb / logistic)
epochs: 30
batch_size: 512
extract_batch_size: 64   # keep low to avoid VRAM OOM during encoding
lr: 1.0e-3
dropout: 0.3
hidden: 256
patience: 10

seed: 42
device: cuda:1
output_dir: outputs/execution-output

